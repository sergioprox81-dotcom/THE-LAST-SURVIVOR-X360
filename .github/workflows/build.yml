
name: Build Xbox 360 XEX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Download game source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build git

      - name: Download xsdk
        run: |
          git clone --depth 1 https://github.com/xenosworks/xsdk.git "$HOME/xsdk"

      - name: Build Xbox 360 toolchain
        run: |
          cd "$HOME/xsdk"
          PREFIX="$HOME/xsdk-gcc" WORK="$HOME/xsdk-gcc-work" JOBS=2 tools/toolchain/build.sh

      - name: Build xsdk
        run: |
          cd "$HOME/xsdk"
          make -j2

      - name: Configure game
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build-game" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/xsdk/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$HOME/xsdk-gcc" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile game
        run: |
          cmake --build "$GITHUB_WORKSPACE/build-game" --parallel 2

      - name: Upload Xbox 360 XEX
        uses: actions/upload-artifact@v4
        with:
          name: THE-LAST-SURVIVOR-X360
          path: build-game/the_last_survivor.xex
          
